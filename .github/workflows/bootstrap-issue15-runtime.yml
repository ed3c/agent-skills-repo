name: bootstrap-issue15-runtime

on:
  push:
    branches:
      - agent/issue-15-benchflow-runtime
    paths:
      - '.github/bootstrap/issue15-runtime/**'
      - '.github/workflows/bootstrap-issue15-runtime.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/bootstrap/issue15-runtime/**'
      - '.github/workflows/bootstrap-issue15-runtime.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.11'
      - name: Reconstruct and verify the reviewed runtime slice
        run: |
          set -euo pipefail
          cat .github/bootstrap/issue15-runtime/chunk-* > "$RUNNER_TEMP/issue15-runtime.b64"
          base64 --decode "$RUNNER_TEMP/issue15-runtime.b64" > "$RUNNER_TEMP/issue15-runtime.tar.xz"
          echo "782cc038624868bcd345398ad96af9aea815ef07d1ab5cccc189b5271793694c  $RUNNER_TEMP/issue15-runtime.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/issue15-runtime.tar.xz"
      - name: Validate the exact materialized files
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.1 -r requirements.lock
          python -m pytest -q \
            tests/test_arena_experiment.py \
            tests/test_arena_experiment_benchflow_adapter.py
          python -m compileall -q skill_arena scripts
          python scripts/arena_experiment.py selftest
          python -m json.tool contracts/arena-benchflow-runtime.schema.json >/dev/null
      - name: Replace bootstrap material with the validated implementation
        run: |
          set -euo pipefail
          rm -rf .github/bootstrap/issue15-runtime
          rm -f .github/workflows/bootstrap-issue15-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(arena): add real BenchFlow paired runtime'
          git push origin HEAD:agent/issue-15-benchflow-runtime
