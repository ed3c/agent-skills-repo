name: skillsbench-execution-parity

on:
  pull_request:
    paths:
      - 'arena_adapters/skillsbench/**'
      - 'contracts/skillsbench-execution-*.schema.json'
      - 'data/skillsbench/import-policy.json'
      - 'data/skillsbench/execution-probe-policy.json'
      - 'scripts/import_skillsbench_tasks.py'
      - 'scripts/run_skillsbench_execution_parity.sh'
      - 'tests/test_skillsbench_execution*.py'
      - '.github/workflows/skillsbench-execution-parity.yml'
  workflow_dispatch:

concurrency:
  group: skillsbench-execution-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle-and-verifier-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        task:
          - dialogue-parser
          - pdf-excel-diff
          - weighted-gdp-calc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.12'
      - name: Install control-plane and isolated execution-adapter environments
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.1 -r requirements.lock
          python -m venv "$RUNNER_TEMP/benchflow-venv"
          "$RUNNER_TEMP/benchflow-venv/bin/python" -m pip install 'benchflow==0.6.3'
          "$RUNNER_TEMP/benchflow-venv/bin/bench" --version
          "$RUNNER_TEMP/benchflow-venv/bin/python" -m pip freeze --all | LC_ALL=C sort \
            > "$RUNNER_TEMP/benchflow-environment.txt"
      - name: Run focused execution evidence controls
        run: |
          python -m pytest -q \
            tests/test_skillsbench_execution.py \
            tests/test_skillsbench_execution_benchflow_shape.py \
            tests/test_skillsbench_execution_image_binding.py
      - name: Fetch exact sparse SkillsBench snapshot
        env:
          SKILLSBENCH_SHA: 9a1f4dd5f7659f75707435da3ce854b6e48321d1
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/skillsbench"
          git init "$root"
          git -C "$root" remote add origin https://github.com/benchflow-ai/skillsbench.git
          git -C "$root" sparse-checkout init --cone
          git -C "$root" sparse-checkout set \
            tasks/dialogue-parser \
            tasks/pdf-excel-diff \
            tasks/weighted-gdp-calc
          git -C "$root" fetch --depth=1 --filter=blob:none origin "$SKILLSBENCH_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$SKILLSBENCH_SHA"
          test -z "$(git -C "$root" status --porcelain --untracked-files=all)"
      - name: Import normalized bundles and resolve task paths
        env:
          TASK_ID: ${{ matrix.task }}
        run: |
          set -euo pipefail
          python scripts/import_skillsbench_tasks.py import \
            --upstream-root "$RUNNER_TEMP/skillsbench" \
            --output-root "$RUNNER_TEMP/arena-task-bundles"
          python scripts/import_skillsbench_tasks.py validate-all \
            --output-root "$RUNNER_TEMP/arena-task-bundles"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import pathlib

          task_id = os.environ['TASK_ID']
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          index = json.loads((root / 'arena-task-bundles/index.json').read_text())
          row = next(row for row in index['bundles'] if row['task_id'] == task_id)
          print(f"SOURCE_TASK={root / 'skillsbench/tasks' / task_id}")
          print(f"NORMALIZED_TASK={root / 'arena-task-bundles' / row['bundle_path'] / 'package'}")
          print(f"BUNDLE_PATH={root / 'arena-task-bundles' / row['bundle_path']}")
          print(f"EVIDENCE_ROOT={root / 'execution-parity' / task_id}")
          PY
      - name: Execute one recorded parity attempt
        id: attempt
        continue-on-error: true
        env:
          TASK_ID: ${{ matrix.task }}
          BENCH_BIN: ${{ runner.temp }}/benchflow-venv/bin/bench
          BENCHFLOW_VERSION: '0.6.3'
          SKILLSBENCH_SHA: 9a1f4dd5f7659f75707435da3ce854b6e48321d1
          RUN_IDENTITY: ${{ github.run_id }}-${{ github.run_attempt }}
          BENCHFLOW_ENVIRONMENT_FILE: ${{ runner.temp }}/benchflow-environment.txt
        run: bash scripts/run_skillsbench_execution_parity.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: skillsbench-execution-parity-${{ matrix.task }}
          path: ${{ runner.temp }}/execution-parity/${{ matrix.task }}
          if-no-files-found: error
          retention-days: 14
      - name: Enforce recorded attempt outcome
        if: always()
        env:
          ATTEMPT_OUTCOME: ${{ steps.attempt.outcome }}
        run: |
          if [ "$ATTEMPT_OUTCOME" != success ]; then
            echo "recorded parity attempt failed; inspect uploaded evidence" >&2
            exit 1
          fi
