name: sandbox-executor-contract

on:
  pull_request:
    paths:
      - 'skill_arena/sandbox_executor/**'
      - 'scripts/run_sandbox_case.py'
      - 'scripts/sandbox_case_runner.py'
      - 'contracts/sandbox-executor.schema.json'
      - 'data/sandbox_cases/**'
      - 'data/sandbox_profiles/**'
      - 'data/verification_runs/openshell_executor_status.json'
      - 'tests/test_sandbox_executor.py'
      - '.github/workflows/sandbox-executor-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.1 -r requirements.lock
      - run: python -m pytest -q tests/test_sandbox_executor.py
      - run: python -m compileall -q skill_arena scripts
      - run: python scripts/run_sandbox_case.py --help
      - name: Assert contract CI is not physical integration evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path('data/verification_runs/openshell_executor_status.json').read_text()
          )
          assert status['real_integration'] == 'not_executed'
          assert status['qualification_eligible'] is False
          PY
