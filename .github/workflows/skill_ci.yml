name: skill-ci

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'

jobs:
  skill-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/git_gate.py
