name: skill-ci

on:
  pull_request:
    paths:
      - '.agents/skills/repo-terminal-operator/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'anchor_oracle/**'
      - 'arena_adapters/**'
      - 'artifacts/repo-terminal-operator/**'
      - 'contracts/**'
      - 'data/**'
      - 'dist/agent-skills/**'
      - 'docs/**'
      - 'openwiki/**'
      - 'scripts/**'
      - 'skill_arena/**'
      - 'skills/**'
      - 'tests/test_*.py'

jobs:
  skill-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.1
      - run: python -m pytest -q tests/test_readme_index.py
      - run: python scripts/git_gate.py
