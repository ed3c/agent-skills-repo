name: skill-ci

on:
  pull_request:
    paths:
      - '.agents/skills/repo-terminal-operator/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'anchor_oracle/**'
      - 'arena_adapters/**'
      - 'artifacts/repo-terminal-operator/**'
      - 'contracts/**'
      - 'data/**'
      - 'dist/agent-skills/**'
      - 'docs/**'
      - 'openwiki/**'
      - 'scripts/**'
      - 'skill_arena/**'
      - 'skills/**'
      - 'tests/test_*.py'

jobs:
  skill-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/git_gate.py
