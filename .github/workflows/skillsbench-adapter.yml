name: skillsbench-adapter

on:
  pull_request:
    paths:
      - 'arena_adapters/**'
      - 'contracts/skillsbench-*.schema.json'
      - 'data/skillsbench/import-policy.json'
      - 'docs/skillsbench-adapter.md'
      - 'scripts/import_skillsbench_tasks.py'
      - 'tests/test_skillsbench_adapter.py'
      - '.github/workflows/skillsbench-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'arena_adapters/**'
      - 'contracts/skillsbench-*.schema.json'
      - 'data/skillsbench/import-policy.json'
      - 'docs/skillsbench-adapter.md'
      - 'scripts/import_skillsbench_tasks.py'
      - 'tests/test_skillsbench_adapter.py'
      - '.github/workflows/skillsbench-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.1 -r requirements.lock 'benchflow==0.6.3'
      - run: python -m pytest -q tests/test_skillsbench_adapter.py
      - name: Fetch exact sparse SkillsBench snapshot
        env:
          SKILLSBENCH_SHA: 9a1f4dd5f7659f75707435da3ce854b6e48321d1
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/skillsbench"
          git init "$root"
          git -C "$root" remote add origin https://github.com/benchflow-ai/skillsbench.git
          git -C "$root" sparse-checkout init --cone
          git -C "$root" sparse-checkout set \
            tasks/dialogue-parser \
            tasks/pdf-excel-diff \
            tasks/weighted-gdp-calc
          git -C "$root" fetch --depth=1 --filter=blob:none origin "$SKILLSBENCH_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$SKILLSBENCH_SHA"
          test -z "$(git -C "$root" status --porcelain --untracked-files=all)"
      - name: Import and validate content-addressed bundles
        run: |
          set -euo pipefail
          python scripts/import_skillsbench_tasks.py import \
            --upstream-root "$RUNNER_TEMP/skillsbench" \
            --output-root "$RUNNER_TEMP/arena-task-bundles"
          python scripts/import_skillsbench_tasks.py validate-all \
            --output-root "$RUNNER_TEMP/arena-task-bundles"
      - name: Run BenchFlow task checks on source and normalized packages
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          upstream = pathlib.Path('${{ runner.temp }}') / 'skillsbench'
          output = pathlib.Path('${{ runner.temp }}') / 'arena-task-bundles'
          index = json.loads((output / 'index.json').read_text())
          evidence = []
          for row in index['bundles']:
              source = upstream / 'tasks' / row['task_id']
              normalized = output / row['bundle_path'] / 'package'
              for label, path in [('upstream', source), ('normalized', normalized)]:
                  result = subprocess.run(
                      ['bench', 'tasks', 'check', str(path)],
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  evidence.append({
                      'task_id': row['task_id'],
                      'surface': label,
                      'returncode': result.returncode,
                      'stdout': result.stdout,
                      'stderr': result.stderr,
                  })
                  if result.returncode != 0:
                      raise SystemExit(
                          f"bench tasks check failed for {row['task_id']} {label}:\n"
                          f"{result.stdout}\n{result.stderr}"
                      )
          (output / 'task-check-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillsbench-adapter-bundles
          path: ${{ runner.temp }}/arena-task-bundles
          if-no-files-found: error
          retention-days: 14
