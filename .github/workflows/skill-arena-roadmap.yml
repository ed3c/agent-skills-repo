name: skill-arena-roadmap

on:
  pull_request:
    paths:
      - 'contracts/skill-arena-roadmap.schema.json'
      - 'data/project/skill-arena-roadmap.json'
      - 'skill_arena/roadmap.py'
      - 'scripts/check_skill_arena_roadmap.py'
      - 'tests/test_skill_arena_roadmap.py'
      - '.github/workflows/skill-arena-roadmap.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/skill-arena-roadmap.schema.json'
      - 'data/project/skill-arena-roadmap.json'
      - 'skill_arena/roadmap.py'
      - 'scripts/check_skill_arena_roadmap.py'
      - 'tests/test_skill_arena_roadmap.py'
      - '.github/workflows/skill-arena-roadmap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.1 -r requirements.lock
      - run: python -m pytest -q tests/test_skill_arena_roadmap.py
      - run: python scripts/check_skill_arena_roadmap.py
