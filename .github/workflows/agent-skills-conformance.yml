name: agent-skills-conformance

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'dist/agent-skills/**'
      - 'data/agent-skills/export-policy.json'
      - 'data/lifecycle/**'
      - 'contracts/agent-skills-export.schema.json'
      - 'skill_arena/agent_skills_export.py'
      - 'scripts/export_agent_skills.py'
      - 'tests/test_agent_skills_export.py'
      - '.github/workflows/agent-skills-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'dist/agent-skills/**'
      - 'data/agent-skills/export-policy.json'
      - 'data/lifecycle/**'
      - 'contracts/agent-skills-export.schema.json'
      - 'skill_arena/agent_skills_export.py'
      - 'scripts/export_agent_skills.py'
      - 'tests/test_agent_skills_export.py'
      - '.github/workflows/agent-skills-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-agent-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.1 -r requirements.lock
      - run: python -m pytest -q tests/test_agent_skills_export.py
      - run: python scripts/export_agent_skills.py --check
      - name: Install pinned upstream Agent Skills reference validator
        run: >-
          python -m pip install
          'skills-ref @ git+https://github.com/agentskills/agentskills.git@217be548739f21d6008915c29aefe320ea1a90af#subdirectory=skills-ref'
      - name: Validate every portable skill with upstream skills-ref
        run: |
          set -euo pipefail
          for skill in dist/agent-skills/*/; do
            skills-ref validate "$skill"
          done
