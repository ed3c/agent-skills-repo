name: historical-calibration-provenance

on:
  pull_request:
    paths:
      - 'data/calibration/historical/**'
      - 'contracts/historical-calibration-provenance.schema.json'
      - 'skill_arena/calibration_provenance.py'
      - 'scripts/check_historical_calibration_provenance.py'
      - 'tests/test_historical_calibration_provenance.py'
      - 'docs/historical-calibration-provenance.md'
      - '.github/workflows/historical-calibration-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'data/calibration/historical/**'
      - 'contracts/historical-calibration-provenance.schema.json'
      - 'skill_arena/calibration_provenance.py'
      - 'scripts/check_historical_calibration_provenance.py'
      - 'tests/test_historical_calibration_provenance.py'
      - 'docs/historical-calibration-provenance.md'
      - '.github/workflows/historical-calibration-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.1 -r requirements.lock
      - run: python -m pytest -q tests/test_historical_calibration_provenance.py
      - run: python scripts/check_historical_calibration_provenance.py
      - run: python -m compileall -q skill_arena scripts
