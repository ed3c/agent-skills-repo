name: landing-evidence

on:
  pull_request:
    paths:
      - 'contracts/landing-evidence.schema.json'
      - 'data/project/landing-evidence.json'
      - 'skill_arena/landing_evidence.py'
      - 'scripts/check_landing_evidence.py'
      - 'tests/test_landing_evidence.py'
      - '.github/workflows/landing-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/landing-evidence.schema.json'
      - 'data/project/landing-evidence.json'
      - 'skill_arena/landing_evidence.py'
      - 'scripts/check_landing_evidence.py'
      - 'tests/test_landing_evidence.py'
      - '.github/workflows/landing-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.1 -r requirements.lock
      - run: python -m pytest -q tests/test_landing_evidence.py
      - run: python scripts/check_landing_evidence.py --main-ref origin/main
