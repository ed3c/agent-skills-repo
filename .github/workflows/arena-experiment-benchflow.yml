name: arena-experiment-benchflow

on:
  pull_request:
    paths:
      - 'skill_arena/experiment/**'
      - 'scripts/arena_experiment.py'
      - 'scripts/run_arena_benchflow_experiment.py'
      - 'scripts/check_arena_benchflow_runtime.py'
      - 'scripts/check_arena_provider_preflight.py'
      - 'scripts/preflight_arena_provider.py'
      - 'contracts/arena-experiment.schema.json'
      - 'contracts/arena-benchflow-runtime.schema.json'
      - 'contracts/arena-provider-policy.schema.json'
      - 'contracts/github-models-retirement-authority.schema.json'
      - 'data/arena/benchflow-dialogue-parser-github-models.json'
      - 'data/arena/github-models-retirement.json'
      - 'data/arena/ollama-qwen3-4b-local.json'
      - 'data/arena/provider-observation-revocations.json'
      - 'data/verification_runs/ollama_qwen3_provider_preflight_2026-08-12.json'
      - 'data/verification_runs/ollama_qwen3_provider_attempt_2026-08-12.json'
      - 'tests/test_arena_experiment.py'
      - 'tests/test_arena_experiment_benchflow_adapter.py'
      - 'tests/test_arena_provider_policy.py'
      - 'docs/arena-provider-policy.md'
      - 'docs/arena-benchflow-runtime.md'
      - '.github/workflows/arena-experiment-benchflow.yml'
  workflow_dispatch:

concurrency:
  group: arena-experiment-benchflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.1 -r requirements.lock
      - run: |
          python -m pytest -q \
            tests/test_arena_experiment.py \
            tests/test_arena_experiment_benchflow_adapter.py \
            tests/test_arena_provider_policy.py
      - run: python -m compileall -q skill_arena scripts
      - run: python scripts/arena_experiment.py selftest
      - run: python -m json.tool contracts/arena-benchflow-runtime.schema.json >/dev/null
      - run: python -m json.tool contracts/arena-provider-policy.schema.json >/dev/null
      - run: python -m json.tool data/arena/ollama-qwen3-4b-local.json >/dev/null
      - run: python -m json.tool contracts/github-models-retirement-authority.schema.json >/dev/null
      - run: python -m json.tool data/arena/github-models-retirement.json >/dev/null
      - name: Verify proposed local provider policy and landed capability receipt offline
        run: |
          python scripts/preflight_arena_provider.py \
            --policy data/arena/ollama-qwen3-4b-local.json \
            --validate-only
          python scripts/check_arena_provider_preflight.py \
            --policy data/arena/ollama-qwen3-4b-local.json \
            --receipt data/verification_runs/ollama_qwen3_provider_preflight_2026-08-12.json \
            --attempt-receipt data/verification_runs/ollama_qwen3_provider_attempt_2026-08-12.json

  # Retained as an archival outline of PR #42's failed physical attempt.
  # GitHub Models is retired, so this job must never be scheduled again.
  paired-runtime:
    if: ${{ false }} # retired provider; archival specification only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.12'
      - name: Install control plane and pinned BenchFlow adapter
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.1 -r requirements.lock
          python -m venv "$RUNNER_TEMP/benchflow-venv"
          "$RUNNER_TEMP/benchflow-venv/bin/python" -m pip install 'benchflow==0.6.3'
          test "$("$RUNNER_TEMP/benchflow-venv/bin/bench" --version)" = "benchflow 0.6.3"
      - name: Fetch exact sparse SkillsBench snapshot
        env:
          SKILLSBENCH_SHA: 9a1f4dd5f7659f75707435da3ce854b6e48321d1
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/skillsbench"
          git init "$root"
          git -C "$root" remote add origin https://github.com/benchflow-ai/skillsbench.git
          git -C "$root" sparse-checkout init --cone
          git -C "$root" sparse-checkout set \
            tasks/dialogue-parser \
            tasks/pdf-excel-diff \
            tasks/weighted-gdp-calc
          git -C "$root" fetch --depth=1 --filter=blob:none origin "$SKILLSBENCH_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$SKILLSBENCH_SHA"
          test -z "$(git -C "$root" status --porcelain --untracked-files=all)"
      - name: Import and validate the pinned content-addressed task bundle
        run: |
          set -euo pipefail
          python scripts/import_skillsbench_tasks.py import \
            --upstream-root "$RUNNER_TEMP/skillsbench" \
            --output-root "$RUNNER_TEMP/arena-task-bundles"
          python scripts/import_skillsbench_tasks.py validate-all \
            --output-root "$RUNNER_TEMP/arena-task-bundles"
      - name: Execute one preregistered six-invocation paired matrix
        id: attempt
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_IDENTITY: pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/arena-benchflow-runtime" "$RUNNER_TEMP/arena-benchflow-attempt"
          python scripts/run_arena_benchflow_experiment.py \
            --runtime-policy data/arena/benchflow-dialogue-parser-github-models.json \
            --bundles-root "$RUNNER_TEMP/arena-task-bundles" \
            --task-id dialogue-parser \
            --bench-bin "$RUNNER_TEMP/benchflow-venv/bin/bench" \
            --output-root "$RUNNER_TEMP/arena-benchflow-runtime" \
            --run-identity "$RUN_IDENTITY" \
            > >(tee "$RUNNER_TEMP/arena-benchflow-attempt/stdout.log") \
            2> >(tee "$RUNNER_TEMP/arena-benchflow-attempt/stderr.log" >&2)
      - name: Verify the emitted evidence without model credentials
        id: verify
        if: steps.attempt.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/check_arena_benchflow_runtime.py \
            --root "$RUNNER_TEMP/arena-benchflow-runtime" \
            | tee "$RUNNER_TEMP/arena-benchflow-attempt/offline-verification.json"
      - name: Record the workflow attempt outcome
        if: always()
        env:
          ATTEMPT_OUTCOME: ${{ steps.attempt.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome || 'skipped' }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'arena-benchflow-attempt'
          root.mkdir(parents=True, exist_ok=True)
          value = {
              'schema_version': 'arena-runtime-workflow-attempt@1',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'head_sha': os.environ['GITHUB_SHA'],
              'attempt_outcome': os.environ['ATTEMPT_OUTCOME'],
              'offline_verification_outcome': os.environ['VERIFY_OUTCOME'],
          }
          (root / 'workflow-attempt.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n'
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: arena-benchflow-dialogue-parser-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arena-benchflow-runtime
            ${{ runner.temp }}/arena-benchflow-attempt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce the recorded attempt and independent replay
        if: always()
        env:
          ATTEMPT_OUTCOME: ${{ steps.attempt.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome || 'skipped' }}
        run: |
          if [ "$ATTEMPT_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            echo "real paired Arena attempt failed; inspect the uploaded evidence" >&2
            exit 1
          fi
